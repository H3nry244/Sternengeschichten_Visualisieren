name: Automatisiertes Podcast Update

on:
  schedule:
    # Läuft jeden Freitag um 12:00 Uhr UTC (ca. 14:00 Uhr unserer Zeit)
    - cron: '0 12 * * 5'
  workflow_dispatch: # Ermöglicht manuellen Start per Klick auf GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # WICHTIG: Erlaubt dem Bot, die neue episodes.json ins Repo zu pushen

    steps:
    - name: Code aus dem Repository auschecken
      uses: actions/checkout@v4

    - name: Python auf dem Server installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Cacht pip-Packages, damit der Build bei nächsten Mal schneller läuft

    - name: Python-Bibliotheken installieren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Scraper-Skript ausführen
      run: python scraper.py

    # NEU: KI-Vektoren für neue/geänderte Folgen berechnen
    - name: Vektor-Embeddings berechnen
      run: python build_topics.py

    - name: Änderungen prüfen und automatisch commiten
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add episodes.json
        
        # Nur commiten, wenn sich die episodes.json durch Scraper oder KI verändert hat
        if git diff --staged --quiet; then
          echo "Keine neuen Folgen oder Änderungen gefunden. Alles up to date!"
        else
          git commit -m "Automatisches Update: Neue Folgen gescrapt und KI-Vektoren aktualisiert"
          git push
        fi